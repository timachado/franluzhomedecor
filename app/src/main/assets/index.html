<title>Bíblia EBD</title>
<style>
:root{--bg:#070916;--panel:#11152b;--panel2:#171c38;--panel3:#20264a;--text:#f6f7ff;--muted:#a7acc4;--purple:#6b4cff;--purple2:#5b35f5;--orange:#ff7a20;--yellow:#ffc43d;--pink:#ff3e9d;--green:#22c98b;--teal:#20c6c7;--blue:#3f7bff;--red:#ff3d55;--line:#2a3156;--shadow:0 16px 40px rgba(0,0,0,.28);--navH:72px;--topH:62px;--r:18px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.shell{min-height:100vh;padding-bottom:calc(var(--navH) + 18px)}.topbar{height:var(--topH);position:sticky;top:0;z-index:50;background:rgba(7,9,22,.96);backdrop-filter:blur(16px);display:flex;align-items:center;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,.045)}.brand{display:flex;align-items:center;gap:8px;min-width:0}.brandmark{width:31px;height:31px;border-radius:8px;background:linear-gradient(145deg,#f0e6ff,#7660ff);display:grid;place-items:center;color:#18122f;font-weight:900;font-size:17px}.brand strong{font-size:14px}.top-actions{margin-left:auto;display:flex;gap:3px}.iconbtn{width:37px;height:37px;border:0;border-radius:12px;background:transparent;color:var(--text);display:grid;place-items:center;font-size:18px}.iconbtn:active{background:var(--panel)}.content{max-width:760px;margin:auto;padding:14px 14px 24px}.welcome{background:linear-gradient(140deg,#7250ff,#5b35f5);border-radius:18px;padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}.welcome:after{content:"✝";position:absolute;right:14px;top:8px;font-size:62px;opacity:.11}.welcome .tiny{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.85}.welcome h1{font-size:22px;margin:4px 0 4px}.welcome p{font-size:11px;margin:0;color:#ede9ff}.section{margin-top:17px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:9px}.section-title h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:0;color:#f4f5ff}.section-title small{font-size:9px;color:var(--muted)}.continue{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:center}.continue .bookico{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#5140c6,#2c2c69);display:grid;place-items:center;font-size:25px}.continue strong{display:block;font-size:13px}.continue span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.continue .go{margin-left:auto;background:transparent;border:0;color:#fff;font-size:18px}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tool{min-height:91px;border:0;border-radius:16px;color:#fff;text-align:left;padding:13px;position:relative;overflow:hidden;box-shadow:0 7px 20px rgba(0,0,0,.18)}.tool .emo{font-size:24px;display:block;margin-bottom:9px}.tool strong{display:block;font-size:12px}.tool small{font-size:9px;opacity:.84;line-height:1.3}.tool .tag{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.16);padding:3px 6px;border-radius:999px;font-size:7px}.purple{background:linear-gradient(145deg,#704dff,#5830ed)}.red{background:linear-gradient(145deg,#ff5367,#e62f48)}.orange{background:linear-gradient(145deg,#ff8733,#ff6a18)}.yellow{background:linear-gradient(145deg,#ffc84c,#e8a929);color:#241800}.pink{background:linear-gradient(145deg,#ff4fa8,#e73390)}.green{background:linear-gradient(145deg,#36d8a0,#10ae79)}.blue{background:linear-gradient(145deg,#4c8cff,#356bdf)}.teal{background:linear-gradient(145deg,#31cfce,#16aaa9)}.outline{background:linear-gradient(145deg,#11152b,#0b0e20);border:1px dashed #4d5680}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:13px}.quote{border-left:3px solid var(--orange);padding-left:10px}.quote p{font-size:12px;line-height:1.5;margin:0}.quote small{color:var(--muted);font-size:9px}.bottomnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);height:var(--navH);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,10,24,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:40}.bottomnav button{border:0;background:transparent;color:#9da3bb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottomnav span{font-size:17px}.bottomnav small{font-size:8px}.bottomnav .active{color:#fff}.bottomnav .active span{background:#272f5b;border-radius:10px;min-width:36px;height:30px;display:grid;place-items:center}.pagehead{display:flex;align-items:center;gap:10px;margin:3px 0 13px}.back{width:35px;height:35px;border:0;background:var(--panel);border-radius:10px;color:#fff}.pagehead h1{font-size:20px;margin:0}.pagehead p{font-size:9px;color:var(--muted);margin:2px 0 0}.field{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #3a426e;background:#151a35;color:#fff;outline:none}.field:focus{border-color:#765dff}.row{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.btn-primary{background:var(--orange);color:#fff}.btn-purple{background:var(--purple);color:#fff}.btn-dark{background:#252b52;color:#fff}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #38416c;background:#191f3d;color:#e6e8f4;padding:7px 9px;border-radius:999px;font-size:9px}.chapter-card{background:linear-gradient(145deg,#6f4cff,#4e2bd6);border-radius:15px;padding:13px;margin-bottom:10px}.chapter-card .rowtop{display:flex;justify-content:space-between}.chapter-card h2{font-size:14px;margin:0}.chapter-card small{font-size:8px}.chapter-card .num{font-size:26px;font-weight:900;opacity:.9}.accordion{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:9px}.acc-head{padding:12px 13px;font-size:10px;font-weight:900;display:flex;justify-content:space-between;background:#1b2141}.acc-body{padding:12px 13px;color:#d9dcef;font-size:10px;line-height:1.5}.tip{background:#2c1e22;border-left:3px solid var(--orange);border-radius:10px;padding:10px;font-size:9px;color:#f4d7c6;margin-bottom:10px}.orange-label{background:linear-gradient(90deg,#fb7320,#f29b2c);border-radius:7px;padding:6px 8px;font-size:9px;font-weight:900;margin:8px 0}.verse{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.055);font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1.55}.vnum{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#614cff;font-family:Inter,sans-serif;font-size:8px;font-weight:900;margin-right:7px;color:#fff}.book-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.book{border:0;border-radius:12px;background:linear-gradient(145deg,#7a5bff,#5a37e7);color:#fff;padding:10px;text-align:left}.book strong{font-size:11px}.book small{display:block;font-size:8px;opacity:.85}.subhead{font-size:10px;text-transform:uppercase;color:#9ea5c2;margin:14px 0 7px;letter-spacing:.7px}.mag-cover{background:linear-gradient(145deg,#5f2a21,#291713);border-radius:16px;padding:14px;position:relative;overflow:hidden}.mag-cover:after{content:"LIÇÕES\A BÍBLICAS";white-space:pre;position:absolute;right:10px;top:9px;color:#fff;font-family:Georgia,serif;text-align:right;font-size:18px;line-height:.9;opacity:.18}.mag-cover .label{font-size:9px;color:#ffd1bf}.mag-cover h2{font-family:Georgia,serif;font-size:20px;margin:7px 0}.mag-cover p{font-size:10px;max-width:82%;color:#e7c8bd}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{border:0;background:#1a2040;color:#aeb4cf;padding:8px 11px;border-radius:999px;font-size:9px;white-space:nowrap}.tab.active{background:var(--purple);color:#fff}.list-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.list-card strong{font-size:11px}.list-card p{font-size:9px;color:var(--muted);line-height:1.45;margin:4px 0 0}.form-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.form-card h3{font-size:11px;margin:0 0 10px}.form-card label{font-size:8px;color:#c4c9dc;display:block;margin:8px 0 4px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:16px}.stat small{font-size:7px}.result{background:#11162d;border:1px solid #313a66;border-radius:13px;padding:12px;font-size:10px;line-height:1.5;margin-top:10px}.term{background:linear-gradient(145deg,#5adf9a,#36c879);border-radius:16px;padding:16px}.term h2{font-size:25px;margin:0}.term p{font-size:10px;margin:4px 0}.empty{text-align:center;padding:42px 20px;color:#9fa6bf}.empty .big{font-size:44px}.empty strong{display:block;margin-top:8px;color:#fff}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#1e2448;color:#fff;border:1px solid #3a426f;border-radius:12px;padding:9px 12px;font-size:9px;opacity:0;transition:.2s;z-index:90}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:380px){.content{padding:12px}.welcome h1{font-size:20px}.tool{min-height:86px;padding:11px}.topbar{padding-left:10px;padding-right:10px}}@media(min-width:680px){.tools{grid-template-columns:repeat(4,1fr)}.book-list{grid-template-columns:repeat(4,1fr)}.content{padding:20px}.welcome{padding:22px}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><div class="brand" data-route="home"><div class="brandmark">✝️</div><strong>Bíblia EBD</strong></div><div class="top-actions"><button class="iconbtn" id="bell">🔔</button><button class="iconbtn" id="sun">☀️</button><button class="iconbtn" id="menu">☰</button></div></header><main class="content" id="app"></main><nav class="bottomnav"><button id="backBtn"><span>‹</span><small>Voltar</small></button><button data-route="home" class="active"><span>🏠</span><small>Início</small></button><button data-route="bible"><span>📖</span><small>Bíblia</small></button><button data-route="profile"><span>👤</span><small>Perfil</small></button></nav></div><div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const state={route:location.hash.replace('#/','')||'home',book:'Gênesis',chapter:1,notes:JSON.parse(localStorage.getItem('dark-notes')||'[]'),favs:JSON.parse(localStorage.getItem('dark-favs')||'[]')};
const books=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cantares','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oséias','Joel','Amós','Obadias','Jonas','Miquéias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse'];
const demo={'Gênesis 1':['No princípio criou Deus os céus e a terra.','A terra era sem forma e vazia; havia trevas sobre a face do abismo, e o Espírito de Deus se movia sobre as águas.','E disse Deus: Haja luz. E houve luz.','Viu Deus que a luz era boa; e fez separação entre a luz e as trevas.','Deus chamou à luz Dia e às trevas Noite. Houve tarde e manhã: o primeiro dia.'],'Salmos 23':['O Senhor é o meu pastor; nada me faltará.','Ele me faz repousar em pastos verdejantes e me conduz junto às águas tranquilas.','Refrigera a minha alma e guia-me pelas veredas da justiça por amor do seu nome.','Ainda que eu ande pelo vale da sombra da morte, não temerei mal algum, porque tu estás comigo.'],'Tiago 1':['Tiago, servo de Deus e do Senhor Jesus Cristo, às doze tribos que estão dispersas: saudações.','Meus irmãos, tende por motivo de grande alegria o passardes por várias provações.','Sabendo que a prova da vossa fé produz perseverança.','Tenha, porém, a perseverança a sua obra completa, para que sejais maduros e íntegros.']};
function save(){localStorage.setItem('dark-notes',JSON.stringify(state.notes));localStorage.setItem('dark-favs',JSON.stringify(state.favs))}function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}function nav(r){state.route=r;location.hash='#/'+r;render();window.scrollTo({top:0})}function tool(cls,emo,title,sub,route,tag=''){return `<button class="tool ${cls}" data-route="${route}">${tag?`<span class="tag">${tag}</span>`:''}<span class="emo">${emo}</span><strong>${title}</strong><small>${sub}</small></button>`}
function home(){return `<section class="welcome"><span class="tiny">Bíblia • estudo • EBD</span><h1>Olá! 👋</h1><p>Continue seu estudo da Palavra e prepare sua aula.</p></section><section class="section"><div class="section-title"><h2>Continuar leitura</h2><small>último acesso</small></div><div class="continue" data-route="reader"><div class="bookico">📖</div><div><strong>Gênesis 1</strong><span>Almeida • capítulo 1</span></div><button class="go">›</button></div></section><section class="section"><div class="section-title"><h2>Ferramentas</h2><small>estudo completo</small></div><div class="tools">${tool('purple','📖','Bíblia','Livros e capítulos','bible')}${tool('red','🎵','Harpa Cristã','Hinos e favoritos','harpa')}${tool('orange','❤️','Favoritos','Versículos salvos','favorites')}${tool('yellow','📝','Anotações','Caderno de estudo','notes')}${tool('pink','🛠️','Esboços','Criar novo esboço','outlines','IA')}${tool('green','📚','Dicionário','Termos bíblicos','dictionary')}${tool('blue','🧑‍🏫','Escola Bíblica','Lições e revistas','ebd','EBD')}${tool('teal','☷','Concordância','Pesquisa bíblica','concordance')}${tool('outline','✨','Novas ferramentas','Em desenvolvimento','tools')}</div></section><section class="section"><div class="section-title"><h2>Palavra do dia</h2></div><div class="panel quote"><p>“Lâmpada para os meus pés é tua palavra e luz para o meu caminho.”</p><small>Salmos 119:105</small></div></section>`}
function bible(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>Escolha um Livro</h1><p>Navegue pelas Escrituras Sagradas.</p></div></div><select class="field" id="version"><option>Almeida Corrigida Fiel (ACF)</option><option>Almeida Revista e Atualizada</option></select><div class="row" style="margin-top:8px"><input class="field" id="bookSearch" placeholder="Digite o nome do livro..."></div><div class="subhead">Livros recentes</div><div class="chips"><button class="chip" data-openbook="Gênesis">Gênesis</button><button class="chip" data-openbook="Salmos">Salmos</button><button class="chip" data-openbook="Tiago">Tiago</button><button class="chip" data-openbook="João">João</button></div><div class="subhead">Livros</div><div class="book-list" id="bookList">${books.map(b=>`<button class="book" data-openbook="${b}"><strong>${b}</strong><small>Abrir livro</small></button>`).join('')}</div>`}
function reader(){const key=state.book+' '+state.chapter,vs=demo[key]||['Conteúdo deste capítulo será incluído na base bíblica completa.'];return `<div class="chapter-card"><div class="rowtop"><div><h2>${state.book}</h2><small>Capítulo ${state.chapter}</small></div><div class="num">${state.chapter}</div></div><p style="font-size:9px;margin:8px 0 0">Explore os versículos deste capítulo e aprofunde seu estudo da Palavra de Deus.</p></div><div class="accordion"><div class="acc-head">📚 ESTUDOS DO CAPÍTULO <span>⌄</span></div><div class="acc-body"><b>Contexto</b><p>Panorama do capítulo, tema central, estrutura e aplicações para estudo pessoal e Escola Dominical.</p><b>Informações gerais</b><p>Autoria, período, cenário e conexões bíblicas importantes.</p></div></div><div class="tip"><b>💡 Dica: Leitura eficiente</b><br>Leia o capítulo inteiro para contexto. Anote palavras-chave e volte aos versículos mais relevantes para seu estudo.</div><div class="orange-label">A criação do mundo e da luz</div><div class="panel">${vs.map((v,i)=>`<div class="verse" data-verse="${i+1}"><span class="vnum">${i+1}</span>${v}</div>`).join('')}</div><div class="orange-label">A separação das águas e a criação do céu</div><div class="panel quote"><p>Selecione e salve versículos nos favoritos ou adicione observações em suas anotações.</p></div>`}
function ebd(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>Escola Bíblica Dominical</h1><p>Revistas, lições e plano de aula.</p></div></div><section class="mag-cover"><span class="label">REVISTA DO TRIMESTRE</span><h2>Lições Bíblicas</h2><p>Estudo, ensino, aplicação e preparação para professores e alunos.</p></section><div class="tabs"><button class="tab active">Revistas</button><button class="tab">Lições</button><button class="tab">Professor</button><button class="tab">Perguntas</button></div><div class="list-card"><strong>📘 Revista Adultos</strong><p>Lições organizadas por trimestre, com texto áureo, verdade prática, tópicos e aplicações.</p></div><div class="list-card"><strong>📗 Revista Jovens</strong><p>Conteúdo com linguagem atual, discussão em classe e perguntas de reflexão.</p></div><div class="list-card"><strong>📙 Revista Adolescentes</strong><p>Estudos objetivos, atividades e aplicações para o cotidiano.</p></div><div class="list-card"><strong>🧑‍🏫 Manual do Professor</strong><p>Plano de aula, objetivos, dinâmica, perguntas e fechamento.</p></div><div class="list-card"><strong>🧒 Revista Infantil</strong><p>Histórias, atividades e recursos para classes infantis.</p></div>`}
function outlines(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>🛠 Criar Novo Esboço</h1><p>Defina a referência bíblica e as opções de análise.</p></div></div><div class="form-card"><h3>1️⃣ Informações Básicas</h3><label>Título do Esboço</label><input class="field" id="outlineTitle" value="Ex: O Bom Pastor - Análise de João 10"><label>Tema do Esboço</label><input class="field" value="Ex: Cuidado Pastoral, Proteção Divina"><label>Tipo de Estudo</label><select class="field"><option>Expositivo (Verso por Verso)</option><option>Temático</option><option>Devocional</option></select><label>Versão da Bíblia</label><select class="field"><option>Almeida Revista e Atualizada</option></select></div><div class="form-card"><h3>2️⃣ Referência Bíblica</h3><input class="field" id="outlineRef" value="Salmos 51"><button class="btn btn-primary" style="margin-top:9px;width:100%" id="createOutline">Gerar Esboço</button></div><div class="statgrid"><div class="stat orange"><b>14</b><small>versículos</small></div><div class="stat purple"><b>0</b><small>gerados</small></div><div class="stat green"><b>14</b><small>disponíveis</small></div></div><div id="outlineResult"></div>`}
function dictionary(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>Dicionário Bíblico</h1><p>Significados, referências e análise textual.</p></div></div><div class="row"><input class="field" id="dictQ" placeholder="Buscar termo..." value="Aarel"><button class="btn btn-purple" id="dictGo">Buscar</button></div><div class="term" style="margin-top:12px"><h2>Aarel</h2><p>Letra A • ocorrência demonstrativa</p></div><div class="list-card"><strong>🔗 Veja Também</strong><p>Harum • Descendente • Família • Genealogia</p></div><div class="accordion"><div class="acc-head">🔊 Análise Textual <span>AI</span></div><div class="acc-body"><b>Etimologia</b><p>A palavra pode ser examinada por contexto, uso histórico e relação com outros termos encontrados nas Escrituras.</p><b>Contexto Histórico</b><p>Informações introdutórias ajudam a compreender pessoas, lugares e conceitos bíblicos.</p></div></div>`}
function notes(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>Minhas Anotações</h1><p>Seu estudo pessoal salvo no aparelho.</p></div></div><button class="btn btn-primary" id="newNote">+ Nova anotação</button>${state.notes.length?state.notes.map((n,i)=>`<div class="list-card"><strong>📝 ${n.t}</strong><p>${n.x}</p><button class="chip" data-del="${i}">Excluir</button></div>`).join(''):`<div class="empty"><div class="big">📝</div><strong>Nenhuma anotação</strong><p>Crie sua primeira anotação de estudo.</p></div>`}`}
function favorites(){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>Versículos Favoritos</h1><p>Seus trechos marcados.</p></div></div>${state.favs.length?state.favs.map(f=>`<div class="list-card"><strong>❤️ ${f.r}</strong><p>${f.t}</p></div>`).join(''):`<div class="empty"><div class="big">❤️</div><strong>Nenhum favorito ainda</strong><p>Toque em um versículo para salvar.</p></div>`}`}
function profile(){return `<div class="pagehead"><div><h1>Perfil</h1><p>Seu progresso de leitura e estudo.</p></div></div><div class="welcome"><span class="tiny">Perfil de estudo</span><h1>Cristão 👋</h1><p>Bíblia EBD • modo de desenvolvimento</p></div><section class="section"><div class="statgrid"><div class="stat purple"><b>3</b><small>leituras</small></div><div class="stat orange"><b>${state.notes.length}</b><small>notas</small></div><div class="stat green"><b>${state.favs.length}</b><small>favoritos</small></div></div></section>`}
function placeholder(title,emo){return `<div class="pagehead"><button class="back" data-back>‹</button><div><h1>${emo} ${title}</h1><p>Ferramenta em preparação.</p></div></div><div class="empty"><div class="big">${emo}</div><strong>${title}</strong><p>Esta área será completada nas próximas versões da Bíblia EBD.</p></div>`}
function render(){let h;if(state.route==='home')h=home();else if(state.route==='bible')h=bible();else if(state.route==='reader')h=reader();else if(state.route==='ebd')h=ebd();else if(state.route==='outlines')h=outlines();else if(state.route==='dictionary')h=dictionary();else if(state.route==='notes')h=notes();else if(state.route==='favorites')h=favorites();else if(state.route==='profile')h=profile();else{const map={harpa:['Harpa Cristã','🎵'],publicNotes:['Anotações Públicas','🔗'],concordance:['Concordância Bíblica','☷'],tools:['Novas Ferramentas','🛠️']};const m=map[state.route]||['Ferramenta','🛠️'];h=placeholder(...m)}$('#app').innerHTML=h;$$('.bottomnav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));bind()}
function bind(){$$('[data-route]').forEach(e=>e.onclick=()=>nav(e.dataset.route));$$('[data-back]').forEach(e=>e.onclick=()=>history.length>1?history.back():nav('home'));$$('[data-openbook]').forEach(e=>e.onclick=()=>{state.book=e.dataset.openbook;state.chapter=1;nav('reader')});const q=$('#bookSearch');if(q)q.oninput=()=>$$('#bookList .book').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q.value.toLowerCase())?'block':'none');$$('.verse').forEach(v=>v.onclick=()=>{const key=state.book+' '+state.chapter,t=(demo[key]||[])[Number(v.dataset.verse)-1];if(t){state.favs.unshift({r:`${state.book} ${state.chapter}:${v.dataset.verse}`,t});save();toast('Versículo salvo ❤️')}});const n=$('#newNote');if(n)n.onclick=()=>{const t=prompt('Título da anotação','Estudo de hoje');if(!t)return;const x=prompt('Anotação','');state.notes.unshift({t,x:x||''});save();render()};$$('[data-del]').forEach(e=>e.onclick=()=>{state.notes.splice(Number(e.dataset.del),1);save();render()});const co=$('#createOutline');if(co)co.onclick=()=>{$('#outlineResult').innerHTML=`<div class="result"><b>✅ Esboço gerado</b><h3>${$('#outlineTitle').value}</h3><p><b>Referência:</b> ${$('#outlineRef').value}</p><p><b>Introdução:</b> contexto da passagem e tema principal.</p><p><b>1. Exposição do texto</b><br><b>2. Verdade central</b><br><b>3. Aplicação prática</b></p></div>`};const dg=$('#dictGo');if(dg)dg.onclick=()=>toast('Consulta atualizada')}
$('#backBtn').onclick=()=>history.length>1?history.back():nav('home');$('#bell').onclick=()=>toast('Sem novas notificações');$('#sun').onclick=()=>toast('Tema escuro premium ativo');$('#menu').onclick=()=>toast('Menu principal da Bíblia EBD');window.onhashchange=()=>{state.route=location.hash.replace('#/','')||'home';render()};render();
</script>
</body></html>
