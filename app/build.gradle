plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.timachado.bordatto'
    compileSdk 36

    defaultConfig {
        applicationId 'com.timachado.bordatto'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/bordatto/AndroidManifest.xml'
            java.srcDirs = ['src/bordatto/java']
            res.srcDirs = ['src/bordatto/res']
            python.srcDirs = ['src/bordatto/python']
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        pip {
            install 'pyembroidery==1.5.1'
            install 'pillow'
        }
    }
}
