name: Build Bíblia EBD Android — 1.16.1 Notificações

on:
  push:
    branches:
      - build-biblia-ebd-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Montar Bíblia completa e catálogo da Harpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pd-text-corpus
          git init -q /tmp/pd-text-corpus
          git -C /tmp/pd-text-corpus remote add origin https://github.com/sangchy1972/pd-text-corpus.git
          git -C /tmp/pd-text-corpus config core.sparseCheckout true
          printf 'bibles/pt/\n' > /tmp/pd-text-corpus/.git/info/sparse-checkout
          git -C /tmp/pd-text-corpus fetch -q --depth 1 origin e9df0306d76c8b1bf66aae71fc6e93ed8622c8cc
          git -C /tmp/pd-text-corpus checkout -q FETCH_HEAD
          curl -L --fail --retry 3 -sS https://raw.githubusercontent.com/manda-vai/harpa-crista-digital/752321d683b1450430ea5d8137819b1ba3901a92/src/data/harpa_crista_640_hinos.json -o /tmp/harpa.json
          python3 - <<'PY'
          import json, os, re
          root='/tmp/pd-text-corpus/bibles/pt'
          with open(os.path.join(root,'index.json'),encoding='utf-8') as f: meta=json.load(f)
          names=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse']
          books=[]; chapters=0; verses=0
          assert len(meta['books'])==66 and len(names)==66
          for src,name in zip(meta['books'],names):
              rows=[]
              for c in range(1,src['chapters']+1):
                  with open(os.path.join(root,'books',src['slug'],'chapters',f'{c}.json'),encoding='utf-8') as f: ch=json.load(f)
                  vs=[v['text'].strip() for v in ch['verses']]; assert vs
                  rows.append(vs); chapters+=1; verses+=len(vs)
              books.append({'name':name,'slug':src['slug'],'chapters':rows})
          assert chapters==1189 and verses==31098
          with open('app/src/main/assets/bible-data.js','w',encoding='utf-8') as f:
              f.write('window.BIBLE_DATA_V18='); json.dump({'translation':'João Ferreira de Almeida','license':'Public Domain','stats':{'books':66,'chapters':chapters,'verses':verses},'books':books},f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('/tmp/harpa.json',encoding='utf-8') as f: raw=json.load(f)
          catalog=[]
          for n in range(1,641):
              row=raw.get(str(n)); assert row and row.get('hino')
              catalog.append({'n':n,'title':re.sub(r'^\s*\d+\s*-\s*','',row['hino']).strip()})
          with open('app/src/main/assets/harpa-data.js','w',encoding='utf-8') as f:
              f.write('window.HARPA_CATALOG_V18='); json.dump(catalog,f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('app/src/main/assets/harpa-lyrics-user.js','w',encoding='utf-8') as f: f.write('window.HARPA_LYRICS_USER={};\n')
          print('Bíblia',chapters,verses,'Harpa catálogo',len(catalog))
          PY

      - name: Preparar versão 1.16.1 sem regravar credenciais históricas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 121',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '1.16.1'",s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar 1.16.1 — regressão e notificações
        shell: bash
        run: |
          set -euo pipefail
          for f in stability1141.js app20.js app21.js app22.js app23.js app24.js app25.js app26.js app27.js app28.js app29.js app30.js app31.js app32.js app33.js app34.js app35.js app36.js; do node --check "app/src/main/assets/$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          idx=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert idx.index('app34.js') < idx.index('app35.js') < idx.index('app36.js')
          assert 'v1160.css' in idx and 'v1161.css' in idx
          a=Path('app/src/main/assets/app35.js').read_text(encoding='utf-8')
          n=Path('app/src/main/assets/app36.js').read_text(encoding='utf-8')
          c=Path('app/src/main/assets/v1161.css').read_text(encoding='utf-8')
          assert "startsWith('1.16.')" in a
          assert 'data-diag-id' in a and '__EBD_DIAGNOSTICS_1160__' in a
          assert '__EBD_NOTIFICATIONS_1161__' in n
          assert 'Ativar notificações' in n and 'requestNotificationPermission' in n
          assert 'v1161-notif-action' in c
          assert 'OPENAI_API_KEY' not in a+n
          g=Path('app/build.gradle').read_text(encoding='utf-8')
          assert 'versionCode 121' in g and "versionName '1.16.1'" in g
          m=Path('app/src/main/java/com/timachado/bibliaebd/MainActivity.java').read_text(encoding='utf-8')
          assert 'return "1.16.1";' in m
          assert 'onRequestPermissionsResult' in m and '__EBD_NOTIFICATIONS_1161__' in m
          ebd=Path('app/src/main/assets/app12.js').read_text(encoding='utf-8')
          block=ebd.split('const EBD_LESSONS_110 = [',1)[1].split('];',1)[0]
          assert len(re.findall(r'\{n:\d+,date:',block))==13
          PY
          grep -q '__EBD_OUTLINES_11510__' app/src/main/assets/app34.js
          grep -q '__EBD_SMART_1159__' app/src/main/assets/app33.js
          grep -q '__EBD_NATIVE_1158__' app/src/main/assets/app32.js
          grep -q '__EBD_BACKUP_1142__' app/src/main/assets/app23.js
          grep -q 'font-size:1em!important' app/src/main/assets/v1155.css
          grep -qx 'window.HARPA_LYRICS_USER={};' app/src/main/assets/harpa-lyrics-user.js

      - name: Gerar APK principal técnico
        run: gradle --no-daemon assembleDebug

      - name: Gerar AAB técnico
        run: gradle --no-daemon bundleDebug

      - name: Guardar artefatos técnicos
        shell: bash
        run: |
          mkdir -p /tmp/biblia-main
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-main/Biblia-EBD-1.16.1-Notificacoes-Tecnica.apk
          cp app/build/outputs/bundle/debug/app-debug.aab /tmp/biblia-main/Biblia-EBD-1.16.1-Notificacoes-Tecnica.aab

      - name: Preparar Diagnóstico lado a lado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8').replace("applicationId 'com.timachado.bibliaebd'","applicationId 'com.timachado.bibliaebd.diag'",1); p.write_text(s,encoding='utf-8')
          r=Path('app/src/main/res/values/strings.xml'); x=r.read_text(encoding='utf-8').replace('>Bíblia EBD<','>Bíblia EBD Diagnóstico<',1); r.write_text(x,encoding='utf-8')
          PY

      - name: Gerar APK Diagnóstico
        run: gradle --no-daemon clean assembleDebug

      - name: Validar APK Diagnóstico 1.16.1
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.timachado.bibliaebd.diag' versionCode='121' versionName='1.16.1-teste'" /tmp/badging.txt
          grep -q "application-label:'Bíblia EBD Diagnóstico'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'app36.js'
          unzip -p "$APK" assets/app36.js | grep -q '__EBD_NOTIFICATIONS_1161__'
          unzip -p "$APK" assets/v1161.css | grep -q 'v1161-notif-action'
          unzip -p "$APK" assets/harpa-lyrics-user.js | grep -qx 'window.HARPA_LYRICS_USER={};'

      - name: Guardar Diagnóstico
        shell: bash
        run: |
          mkdir -p /tmp/biblia-diag
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.16.1-Notificacoes.apk

      - name: Publicar técnico
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Android-1.16.1-Notificacoes-Tecnica
          path: /tmp/biblia-main/*
          retention-days: 14

      - name: Publicar Diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Diagnostico-1.16.1-Notificacoes
          path: /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.16.1-Notificacoes.apk
          retention-days: 14
