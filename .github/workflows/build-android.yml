name: Build Bíblia EBD Android

on:
  push:
    branches:
      - build-biblia-ebd-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar versão 1.3.0
        run: |
          sed -i "s/versionCode 5/versionCode 7/" app/build.gradle
          sed -i "s/versionName '1.1.1'/versionName '1.3.0'/" app/build.gradle
      - name: Gerar APK
        run: gradle --no-daemon assembleDebug
      - name: Gerar AAB de teste
        run: gradle --no-daemon bundleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Android-1.3.0-Revistas
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 7