name: Build Bíblia EBD Android — 1.15.9 Busca Inteligente

on:
  push:
    branches:
      - build-biblia-ebd-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Montar Bíblia completa e catálogo da Harpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pd-text-corpus
          git init -q /tmp/pd-text-corpus
          git -C /tmp/pd-text-corpus remote add origin https://github.com/sangchy1972/pd-text-corpus.git
          git -C /tmp/pd-text-corpus config core.sparseCheckout true
          printf 'bibles/pt/\n' > /tmp/pd-text-corpus/.git/info/sparse-checkout
          git -C /tmp/pd-text-corpus fetch -q --depth 1 origin e9df0306d76c8b1bf66aae71fc6e93ed8622c8cc
          git -C /tmp/pd-text-corpus checkout -q FETCH_HEAD
          curl -L --fail --retry 3 -sS https://raw.githubusercontent.com/manda-vai/harpa-crista-digital/752321d683b1450430ea5d8137819b1ba3901a92/src/data/harpa_crista_640_hinos.json -o /tmp/harpa.json
          python3 - <<'PY'
          import json, os, re
          root='/tmp/pd-text-corpus/bibles/pt'
          with open(os.path.join(root,'index.json'),encoding='utf-8') as f: meta=json.load(f)
          pt_names=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse']
          books=[]; chapters=0; verses_total=0
          assert len(meta['books'])==66 and len(pt_names)==66
          for src,name in zip(meta['books'],pt_names):
              rows=[]
              for c in range(1,src['chapters']+1):
                  with open(os.path.join(root,'books',src['slug'],'chapters',f'{c}.json'),encoding='utf-8') as f: ch=json.load(f)
                  vs=[v['text'].strip() for v in ch['verses']]; assert vs
                  rows.append(vs); chapters+=1; verses_total+=len(vs)
              books.append({'name':name,'slug':src['slug'],'chapters':rows})
          assert chapters==1189 and verses_total==31098
          with open('app/src/main/assets/bible-data.js','w',encoding='utf-8') as f:
              f.write('window.BIBLE_DATA_V18='); json.dump({'translation':'João Ferreira de Almeida','license':'Public Domain','stats':{'books':66,'chapters':chapters,'verses':verses_total},'books':books},f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('/tmp/harpa.json',encoding='utf-8') as f: raw=json.load(f)
          catalog=[]
          for n in range(1,641):
              row=raw.get(str(n)); assert row and row.get('hino')
              catalog.append({'n':n,'title':re.sub(r'^\s*\d+\s*-\s*','',row['hino']).strip()})
          with open('app/src/main/assets/harpa-data.js','w',encoding='utf-8') as f:
              f.write('window.HARPA_CATALOG_V18='); json.dump(catalog,f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('app/src/main/assets/harpa-lyrics-user.js','w',encoding='utf-8') as f: f.write('window.HARPA_LYRICS_USER={};\n')
          print('Bíblia', chapters, verses_total, 'Harpa', len(catalog))
          PY

      - name: Validar 1.15.9
        shell: bash
        run: |
          set -euo pipefail
          for f in stability1141.js app20.js app21.js app22.js app23.js app24.js app25.js app26.js app27.js app28.js app29.js app30.js app31.js app32.js app33.js; do node --check "app/src/main/assets/$f"; done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert s.index('app32.js') < s.index('app33.js')
          assert 'v1159.css' in s and 'app33.js' in s
          a=Path('app/src/main/assets/app33.js').read_text(encoding='utf-8')
          c=Path('app/src/main/assets/v1159.css').read_text(encoding='utf-8')
          assert '__EBD_SMART_1159__' in a
          assert 'BUSCA LOCAL • 31.098 VERSÍCULOS' in a
          assert 'Dicionário Bíblico + Português' in a
          assert 'Atlas de estudo offline' in a
          assert "id:'ansiedade'" in a and "id:'paulo'" in a
          assert 'buildBibleIndex' in a and 'fullText' in a
          assert 'Perguntar à IA' in a
          assert 'v1159-search-hero' in c and 'v1159-place-grid' in c and 'v1159-dict-list' in c
          assert 'OPENAI_API_KEY' not in a
          g=Path('app/build.gradle').read_text(encoding='utf-8')
          assert 'versionCode 118' in g and "versionName '1.15.9'" in g
          PY
          grep -q '__EBD_NATIVE_1158__' app/src/main/assets/app32.js
          grep -q '__EBD_CLASS_AI_1157__' app/src/main/assets/app31.js
          grep -q '__EBD_READER_1155__' app/src/main/assets/app29.js
          grep -q 'font-size:1em!important' app/src/main/assets/v1155.css
          grep -qx 'window.HARPA_LYRICS_USER={};' app/src/main/assets/harpa-lyrics-user.js

      - name: Gerar APK principal técnico
        run: gradle --no-daemon assembleDebug

      - name: Gerar AAB técnico
        run: gradle --no-daemon bundleDebug

      - name: Guardar artefatos técnicos
        shell: bash
        run: |
          mkdir -p /tmp/biblia-main
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-main/Biblia-EBD-1.15.9-Busca-Inteligente-Tecnica.apk
          cp app/build/outputs/bundle/debug/app-debug.aab /tmp/biblia-main/Biblia-EBD-1.15.9-Busca-Inteligente-Tecnica.aab

      - name: Preparar Diagnóstico lado a lado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=s.replace("applicationId 'com.timachado.bibliaebd'","applicationId 'com.timachado.bibliaebd.diag'",1)
          p.write_text(s,encoding='utf-8')
          r=Path('app/src/main/res/values/strings.xml'); x=r.read_text(encoding='utf-8').replace('>Bíblia EBD<','>Bíblia EBD Diagnóstico<',1); r.write_text(x,encoding='utf-8')
          PY

      - name: Gerar APK Diagnóstico
        run: gradle --no-daemon clean assembleDebug

      - name: Validar APK Diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.timachado.bibliaebd.diag' versionCode='118' versionName='1.15.9-teste'" /tmp/badging.txt
          grep -q "application-label:'Bíblia EBD Diagnóstico'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'app33.js'
          unzip -p "$APK" assets/app33.js | grep -q 'Busca Inteligente'
          unzip -p "$APK" assets/v1159.css | grep -q 'v1159-place-grid'
          unzip -p "$APK" assets/harpa-lyrics-user.js | grep -qx 'window.HARPA_LYRICS_USER={};'

      - name: Guardar Diagnóstico
        shell: bash
        run: |
          mkdir -p /tmp/biblia-diag
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.15.9-Busca-Inteligente.apk

      - name: Publicar técnico
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Android-1.15.9-Busca-Inteligente-Tecnica
          path: /tmp/biblia-main/*
          retention-days: 14

      - name: Publicar Diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Diagnostico-1.15.9-Busca-Inteligente
          path: /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.15.9-Busca-Inteligente.apk
          retention-days: 14
