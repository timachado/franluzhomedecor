name: Build Bíblia EBD Android — 1.15.4 IA

on:
  push:
    branches:
      - build-biblia-ebd-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Montar Bíblia completa e catálogo da Harpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pd-text-corpus
          git init -q /tmp/pd-text-corpus
          git -C /tmp/pd-text-corpus remote add origin https://github.com/sangchy1972/pd-text-corpus.git
          git -C /tmp/pd-text-corpus config core.sparseCheckout true
          printf 'bibles/pt/\n' > /tmp/pd-text-corpus/.git/info/sparse-checkout
          git -C /tmp/pd-text-corpus fetch -q --depth 1 origin e9df0306d76c8b1bf66aae71fc6e93ed8622c8cc
          git -C /tmp/pd-text-corpus checkout -q FETCH_HEAD

          curl -L --fail --retry 3 -sS \
            https://raw.githubusercontent.com/manda-vai/harpa-crista-digital/752321d683b1450430ea5d8137819b1ba3901a92/src/data/harpa_crista_640_hinos.json \
            -o /tmp/harpa.json

          python3 - <<'PY'
          import json, os, re
          root='/tmp/pd-text-corpus/bibles/pt'
          with open(os.path.join(root,'index.json'),encoding='utf-8') as f: meta=json.load(f)
          pt_names=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse']
          assert len(meta['books'])==66 and len(pt_names)==66
          books=[]; verse_count=0; chapter_count=0
          for src,name in zip(meta['books'],pt_names):
              chapters=[]
              for c in range(1,src['chapters']+1):
                  path=os.path.join(root,'books',src['slug'],'chapters',f'{c}.json')
                  with open(path,encoding='utf-8') as f: ch=json.load(f)
                  verses=[v['text'].strip() for v in ch['verses']]
                  assert verses
                  chapters.append(verses); verse_count+=len(verses); chapter_count+=1
              books.append({'name':name,'slug':src['slug'],'chapters':chapters})
          assert chapter_count==1189 and verse_count==31098
          bible={'translation':'João Ferreira de Almeida','license':'Public Domain','source':'sangchy1972/pd-text-corpus / seven1m/open-bibles','snapshot':'e9df0306d76c8b1bf66aae71fc6e93ed8622c8cc','stats':{'books':66,'chapters':chapter_count,'verses':verse_count},'books':books}
          with open('app/src/main/assets/bible-data.js','w',encoding='utf-8') as f:
              f.write('window.BIBLE_DATA_V18='); json.dump(bible,f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('/tmp/harpa.json',encoding='utf-8') as f: raw=json.load(f)
          catalog=[]
          for n in range(1,641):
              row=raw.get(str(n)); assert row and row.get('hino')
              title=re.sub(r'^\s*\d+\s*-\s*','',row['hino']).strip(); assert title
              catalog.append({'n':n,'title':title})
          with open('app/src/main/assets/harpa-data.js','w',encoding='utf-8') as f:
              f.write('window.HARPA_CATALOG_V18='); json.dump(catalog,f,ensure_ascii=False,separators=(',',':')); f.write(';\n')
          with open('app/src/main/assets/harpa-lyrics-user.js','w',encoding='utf-8') as f:
              f.write('window.HARPA_LYRICS_USER={};\n')
          print('Bíblia:',len(books),'livros,',chapter_count,'capítulos,',verse_count,'versículos')
          print('Harpa:',len(catalog),'títulos; letras privadas: 0')
          PY

      - name: Preparar versão interna 1.15.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 113',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '1.15.4'",s,count=1)
          if 'versionCode 113' not in s or "versionName '1.15.4'" not in s:
              raise SystemExit('Falha ao preparar 1.15.4 / 113')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar 1.15.4 — continuidade IA e regressão estrutural
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/stability1141.js
          node --check app/src/main/assets/app20.js
          node --check app/src/main/assets/app21.js
          node --check app/src/main/assets/app22.js
          node --check app/src/main/assets/app23.js
          node --check app/src/main/assets/app24.js
          node --check app/src/main/assets/app25.js
          node --check app/src/main/assets/app26.js
          node --check app/src/main/assets/app27.js
          node --check app/src/main/assets/app28.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert s.index('stability1141.js') < s.index('app1.js')
          assert s.index('app23.js') < s.index('app24.js') < s.index('app25.js') < s.index('app26.js') < s.index('app27.js') < s.index('app28.js')
          assert all(x in s for x in ['v115.css','v1151.css','v1152.css','v1153.css','v1154.css'])
          ai=Path('app/src/main/assets/app24.js').read_text(encoding='utf-8')
          cont=Path('app/src/main/assets/app28.js').read_text(encoding='utf-8')
          css=Path('app/src/main/assets/v1154.css').read_text(encoding='utf-8')
          backend=Path('backend/supabase/functions/biblia-ai/index.ts').read_text(encoding='utf-8')
          assert 'OPENAI_API_KEY' not in ai+cont
          assert '__EBD_AI_1154__' in cont
          assert 'ebd-ai-studies-v1154' in cont
          assert 'Novo estudo' in cont and 'Histórico' in cont
          assert 'Salvar conversa' in cont and 'Gerar e salvar esboço' in cont
          assert 'history:previous' in cont
          assert 'historyUsed' in backend and 'cleanHistory' in backend
          assert 'ai1154-studybar' in css and 'ai1154-history' in css
          assert '--ai1153-font:17px' in Path('app/src/main/assets/v1153.css').read_text(encoding='utf-8')
          assert 'REFERÊNCIA DETECTADA' in Path('app/src/main/assets/app26.js').read_text(encoding='utf-8')
          assert 'Estudar com IA' in ai
          PY
          grep -q '__EBD_STABILITY_1141__' app/src/main/assets/stability1141.js
          grep -q '__EBD_BACKUP_1142__' app/src/main/assets/app23.js
          grep -q '__EBD_AI_115__' app/src/main/assets/app24.js
          grep -q '__EBD_AI_1151__' app/src/main/assets/app25.js
          grep -q '__EBD_AI_1152__' app/src/main/assets/app26.js
          grep -q '__EBD_AI_1153__' app/src/main/assets/app27.js
          grep -q '__EBD_AI_1154__' app/src/main/assets/app28.js
          grep -q 'versionCode 113' app/build.gradle
          grep -q "versionName '1.15.4'" app/build.gradle
          grep -q 'height:100dvh!important' app/src/main/assets/v1136.css
          grep -q 'setTextZoom(108)' app/src/main/java/com/timachado/bibliaebd/MainActivity.java
          grep -qx 'window.HARPA_LYRICS_USER={};' app/src/main/assets/harpa-lyrics-user.js

      - name: Gerar APK principal técnico
        run: gradle --no-daemon assembleDebug

      - name: Gerar AAB técnico
        run: gradle --no-daemon bundleDebug

      - name: Guardar artefatos técnicos
        shell: bash
        run: |
          mkdir -p /tmp/biblia-main
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-main/Biblia-EBD-1.15.4-IA-Estudos-Continuos-Tecnica.apk
          cp app/build/outputs/bundle/debug/app-debug.aab /tmp/biblia-main/Biblia-EBD-1.15.4-IA-Estudos-Continuos-Tecnica.aab

      - name: Preparar Diagnóstico lado a lado
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=s.replace("applicationId 'com.timachado.bibliaebd'","applicationId 'com.timachado.bibliaebd.diag'",1)
          if "applicationId 'com.timachado.bibliaebd.diag'" not in s:
              raise SystemExit('Falha ao preparar applicationId diagnóstico')
          p.write_text(s,encoding='utf-8')
          r=Path('app/src/main/res/values/strings.xml')
          x=r.read_text(encoding='utf-8').replace('>Bíblia EBD<','>Bíblia EBD Diagnóstico<',1)
          r.write_text(x,encoding='utf-8')
          PY

      - name: Gerar APK Diagnóstico 1.15.4
        run: gradle --no-daemon clean assembleDebug

      - name: Validar APK Diagnóstico 1.15.4
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/diag-badging.txt
          grep -q "package: name='com.timachado.bibliaebd.diag' versionCode='113' versionName='1.15.4-teste'" /tmp/diag-badging.txt
          grep -q "application-label:'Bíblia EBD Diagnóstico'" /tmp/diag-badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'app28.js'
          unzip -p "$APK" assets/index.html | grep -q 'v1154.css'
          unzip -p "$APK" assets/app28.js | grep -q '__EBD_AI_1154__'
          unzip -p "$APK" assets/app28.js | grep -q 'Gerar e salvar esboço'
          unzip -p "$APK" assets/harpa-lyrics-user.js | grep -qx 'window.HARPA_LYRICS_USER={};'

      - name: Guardar Diagnóstico
        shell: bash
        run: |
          mkdir -p /tmp/biblia-diag
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.15.4-IA-Estudos-Continuos.apk

      - name: Publicar artefatos técnicos internos
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Android-1.15.4-IA-Estudos-Continuos-Tecnica
          path: /tmp/biblia-main/*
          retention-days: 14

      - name: Publicar Diagnóstico instalável lado a lado
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Diagnostico-1.15.4-IA-Estudos-Continuos
          path: /tmp/biblia-diag/Biblia-EBD-Diagnostico-1.15.4-IA-Estudos-Continuos.apk
          retention-days: 14
