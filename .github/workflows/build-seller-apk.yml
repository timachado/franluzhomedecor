name: Build FranLuz Seller APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seller/**'
      - 'settings.gradle'
      - '.github/workflows/build-seller-apk.yml'

jobs:
  build-seller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Seller APK
        run: gradle --no-daemon :seller:clean :seller:assembleDebug
      - name: Verify and rename
        run: |
          ls -lah seller/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs seller/build/outputs/apk/debug/seller-debug.apk
          cp seller/build/outputs/apk/debug/seller-debug.apk FranLuz_Seller_v1.0.0_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-v1.0.0-APK
          path: FranLuz_Seller_v1.0.0_debug.apk
          retention-days: 30
