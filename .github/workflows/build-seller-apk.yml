name: Build FranLuz Seller APK

on:
  push:
    branches: [main]
    paths:
      - 'seller/**'
      - '.github/workflows/build-seller-apk.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build FranLuz Seller
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon :seller:clean :seller:assembleDebug --stacktrace 2>&1 | tee seller-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-v1.0.0-Build-Log
          path: seller-build.log
          retention-days: 7

      - name: Verify and rename APK
        if: steps.build.outputs.status == '0'
        run: |
          APK=seller/build/outputs/apk/debug/seller-debug.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          cp "$APK" FranLuz_Seller_v1.0.0.apk

      - name: Upload APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-v1.0.0-APK
          path: FranLuz_Seller_v1.0.0.apk
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
