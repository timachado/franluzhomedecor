name: Biblia EBD - APK Android

on:
  push:
    branches:
      - build-biblia-ebd-apk
    paths:
      - "biblia-ebd/**"
      - ".github/workflows/biblia-ebd-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK Biblia EBD
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Restaurar projeto Biblia EBD
        shell: bash
        run: |
          set -e
          mkdir -p buildsrc
          cat \
            biblia-ebd/project.part00 \
            biblia-ebd/project.part01 \
            biblia-ebd/project.part02 \
            biblia-ebd/project.part03 \
            biblia-ebd/project.part04 \
            biblia-ebd/project.part05 \
            biblia-ebd/project.part06 \
            > buildsrc/project.b64
          base64 -d buildsrc/project.b64 > buildsrc/project.zip
          echo "1f22e6f912fd640d0106308a5d554f1b299ab40a3c0543ab65a97ccf0b578962  buildsrc/project.zip" | sha256sum -c -
          cd buildsrc
          unzip -q project.zip
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK instalavel
        working-directory: buildsrc/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK final
        shell: bash
        run: |
          set -e
          mkdir -p outputs
          cp buildsrc/android/app/build/outputs/apk/debug/app-debug.apk outputs/Biblia-EBD-v0.1.apk
          test -s outputs/Biblia-EBD-v0.1.apk
          ls -lh outputs/Biblia-EBD-v0.1.apk
          sha256sum outputs/Biblia-EBD-v0.1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-v0.1-APK
          path: outputs/Biblia-EBD-v0.1.apk
          if-no-files-found: error
          retention-days: 7
