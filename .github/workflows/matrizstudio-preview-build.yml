name: Build Matriz Studio Preview APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'MatrizStudioBuild/**'
      - '.github/workflows/matrizstudio-preview-build.yml'

permissions:
  contents: read

jobs:
  build-matriz-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode Matriz Studio source
        run: |
          mkdir -p MatrizStudioBuild/src
          base64 -d MatrizStudioBuild/project.tar.gz.b64 | tar -xzf - -C MatrizStudioBuild/src

      - name: Restore
        working-directory: MatrizStudioBuild/src
        run: dotnet restore MatrizStudio.csproj

      - name: Build installable debug APK
        working-directory: MatrizStudioBuild/src
        run: dotnet publish MatrizStudio.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk

      - name: Collect APK
        run: |
          set -e
          APK=$(find MatrizStudioBuild/src/bin/Debug/net10.0-android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Matriz_Studio_0.1.1_Preview.apk
          ls -lh Matriz_Studio_0.1.1_Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matriz-Studio-0.1.1-Preview-APK
          path: Matriz_Studio_0.1.1_Preview.apk
          retention-days: 7
