name: Build Matriz Studio 1.0.0 Preview APK

on:
  push:
    branches: [matrizstudio-preview-build2]
    paths:
      - 'MatrizStudioBuild/v100/**'
      - '.github/workflows/matrizstudio-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Matriz Studio APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p MatrizStudioCI
          cat MatrizStudioBuild/v100/source_*.b64 | base64 -d | tar -xzf - -C MatrizStudioCI

          mkdir -p MatrizStudioCI/Resources/AppIcon MatrizStudioCI/Resources/Images MatrizStudioCI/Resources/Splash
          cp MatrizStudioBuild/v100/matrizstudiofg.png MatrizStudioCI/Resources/AppIcon/matrizstudiofg.png
          cp MatrizStudioBuild/v100/matrizstudiofg.png MatrizStudioCI/Resources/Images/matrizstudio_logo.png
          cp MatrizStudioBuild/v100/matrizstudiofg.png MatrizStudioCI/Resources/Splash/matrizstudio_splash.png

          dotnet --info
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          dotnet workload install maui-android

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          fi

          dotnet restore MatrizStudioCI/MatrizStudio.csproj
          dotnet publish MatrizStudioCI/MatrizStudio.csproj             -f net10.0-android36.0             -c Release             -p:AndroidPackageFormats=apk             -p:AndroidKeyStore=false 2>&1 | tee MatrizStudioBuild/build.log

          APK=$(find MatrizStudioCI/bin/Release/net10.0-android36.0 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Matriz_Studio_1.0.0_Preview.apk
          sha256sum Matriz_Studio_1.0.0_Preview.apk > Matriz_Studio_1.0.0_Preview.sha256.txt
          echo "APK=$APK" > MatrizStudioBuild/result.txt
          ls -lh Matriz_Studio_1.0.0_Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matriz-Studio-1.0.0-Preview
          path: |
            Matriz_Studio_1.0.0_Preview.apk
            Matriz_Studio_1.0.0_Preview.sha256.txt
            MatrizStudioBuild/build.log
            MatrizStudioBuild/result.txt
          if-no-files-found: error
          retention-days: 7
