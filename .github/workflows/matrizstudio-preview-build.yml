name: Build Matriz Studio Preview APK
on:
  push:
    branches: [matrizstudio-preview-build2]
    paths:
      - 'MatrizStudioBuild/**'
      - '.github/workflows/matrizstudio-preview-build.yml'

permissions:
  contents: read

jobs:
  build-matriz-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and capture diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee MatrizStudioBuild/build.log) 2>&1
          echo "=== ENVIRONMENT ==="
          dotnet --info
          echo "JAVA:"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== INSTALL MAUI ANDROID ==="
          dotnet workload install maui-android
          WORKLOAD_RC=$?
          echo "WORKLOAD_RC=$WORKLOAD_RC"

          echo "=== DECODE SOURCE ==="
          mkdir -p MatrizStudioBuild/src
          cat MatrizStudioBuild/chunks/*.b64 | base64 -d | tar -xzf - -C MatrizStudioBuild/src
          DECODE_RC=$?
          echo "DECODE_RC=$DECODE_RC"

          echo "=== RESTORE ==="
          cd MatrizStudioBuild/src
          dotnet restore MatrizStudio.csproj
          RESTORE_RC=$?
          echo "RESTORE_RC=$RESTORE_RC"

          echo "=== BUILD ==="
          dotnet publish MatrizStudio.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk
          BUILD_RC=$?
          echo "BUILD_RC=$BUILD_RC"
          cd ../..

          echo "=== COLLECT APK ==="
          APK=$(find MatrizStudioBuild/src/bin/Debug/net10.0-android -type f -name '*.apk' 2>/dev/null | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" Matriz_Studio_0.1.1_Preview.apk
            ls -lh Matriz_Studio_0.1.1_Preview.apk
          else
            echo "APK_NOT_FOUND"
          fi

          echo "WORKLOAD_RC=$WORKLOAD_RC DECODE_RC=$DECODE_RC RESTORE_RC=$RESTORE_RC BUILD_RC=$BUILD_RC" > MatrizStudioBuild/result.txt
          exit 0

      - name: Upload APK and build log
        uses: actions/upload-artifact@v4
        with:
          name: Matriz-Studio-0.1.1-Preview-Build
          path: |
            Matriz_Studio_0.1.1_Preview.apk
            MatrizStudioBuild/build.log
            MatrizStudioBuild/result.txt
          if-no-files-found: warn
          retention-days: 7
