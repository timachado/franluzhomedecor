name: Build Biblia EBD 1.19.2 Live Lens DEX

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-biblia-live1192/**'
      - '.github/workflows/build-biblia-live-lens-1192.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-live-lens-dex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Compile live Lens bridge
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$PWD/tmp-biblia-live1192"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8="$ANDROID_HOME/build-tools/36.0.0/d8"
          rm -rf "$ROOT/classes" "$ROOT/dex"
          mkdir -p "$ROOT/classes" "$ROOT/dex"
          javac -source 8 -target 8 -encoding UTF-8             -cp "$ANDROID_JAR"             -d "$ROOT/classes"             "$ROOT/stubs/com/timachado/bibliaebd/LensActivity.java"             "$ROOT/stubs/com/timachado/bibliaebd/LensChromeClient.java"             "$ROOT/src/com/timachado/bibliaebd/LiveActivity.java"             "$ROOT/src/com/timachado/bibliaebd/LiveLensChromeClient.java"
          "$D8" --min-api 24 --lib "$ANDROID_JAR" --classpath "$ROOT/classes"             --output "$ROOT/dex"             "$ROOT/classes/com/timachado/bibliaebd/LiveActivity.class"             "$ROOT/classes/com/timachado/bibliaebd/LiveLensChromeClient.class"
          test -s "$ROOT/dex/classes.dex"
          cp "$ROOT/dex/classes.dex" "$ROOT/Biblia-EBD-1.19.2-LiveLens-classes6.dex"
          ls -lh "$ROOT/Biblia-EBD-1.19.2-LiveLens-classes6.dex"
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-1.19.2-LiveLens-DEX
          path: tmp-biblia-live1192/Biblia-EBD-1.19.2-LiveLens-classes6.dex
          retention-days: 2
