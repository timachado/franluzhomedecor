name: Build Biblia EBD Live Lens Native DEX

on:
  push:
    branches: [temp-biblia-ebd-live-lens-native]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Compile Live Lens bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/live-lens"
          mkdir -p "$ROOT/classes" "$ROOT/dex" "$ROOT/stub/com/timachado/bibliaebd"
          cat > "$ROOT/stub/com/timachado/bibliaebd/AuthActivity.java" <<'JAVA'
          package com.timachado.bibliaebd;
          import android.app.Activity;
          public class AuthActivity extends Activity {}
          JAVA

          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8="$ANDROID_HOME/build-tools/36.0.0/d8"

          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_JAR" \
            -d "$ROOT/classes" \
            "$ROOT/stub/com/timachado/bibliaebd/AuthActivity.java" \
            tmp-biblia-live-lens/src/com/timachado/bibliaebd/LensActivity.java

          mapfile -t CLASSES < <(find "$ROOT/classes/com/timachado/bibliaebd" -maxdepth 1 -type f -name 'LensActivity*.class' -print)
          test "${#CLASSES[@]}" -gt 0

          "$D8" --min-api 24 \
            --lib "$ANDROID_JAR" \
            --classpath "$ROOT/classes" \
            --output "$ROOT/dex" \
            "${CLASSES[@]}"

          test -s "$ROOT/dex/classes.dex"
          cp "$ROOT/dex/classes.dex" "$ROOT/Biblia-EBD-LiveLens-classes5.dex"
          sha256sum "$ROOT/Biblia-EBD-LiveLens-classes5.dex" | tee "$ROOT/SHA256SUMS.txt"
          ls -lh "$ROOT/Biblia-EBD-LiveLens-classes5.dex"

      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-LiveLens-DEX
          path: |
            ${{ runner.temp }}/live-lens/Biblia-EBD-LiveLens-classes5.dex
            ${{ runner.temp }}/live-lens/SHA256SUMS.txt
          retention-days: 2
