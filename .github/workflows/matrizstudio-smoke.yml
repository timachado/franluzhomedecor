name: Matriz Studio Runner Smoke Test
on:
  pull_request:
    branches: [main]
    paths:
      - 'MatrizStudioSmoke/**'
      - '.github/workflows/matrizstudio-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: |
          echo "runner-ok" | tee smoke-result.txt
          uname -a
          which dotnet || true
          dotnet --info || true
          java -version || true
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: matriz-studio-smoke
          path: smoke-result.txt
