name: Diagnose BORDATTO 0.2.31 Anchors
on:
  push:
    branches: [bordatto-apk-build]
    paths:
      - '.github/workflows/diagnose-bordatto-031.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct validated 0.2.30 source
        run: python3 .github/scripts/patch_bordatto_054.py
      - name: Inspect Viewer and Analyzer anchors
        run: |
          SRC="BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt"
          echo '=== Viewer state ==='
          grep -n -B6 -A14 'focusMarker by remember' "$SRC" || true
          echo '=== static visibility badge ==='
          grep -n -B8 -A8 'ExpressiveIconBadge(Icons.Rounded.Visibility' "$SRC" || true
          echo '=== StitchCanvas calls ==='
          grep -n -B10 -A16 'StitchCanvas(' "$SRC" | head -180 || true
          echo '=== all visibleUntil assignments/calls ==='
          grep -n -B3 -A3 'visibleUntil' "$SRC" | head -180 || true
          echo '=== Analyzer declaration ==='
          grep -n -A170 'private fun DesignAnalyzerPanel' "$SRC" | head -190 || true
# runner probe 2026-09-15
