name: Diagnose BORDATTO Hosted Runner
on:
  push:
    branches: [bordatto-apk-build]
    paths:
      - '.github/workflows/diagnose-bordatto-031.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Probe Windows hosted runner
        shell: pwsh
        run: |
          Write-Host "BORDATTO runner probe"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          dotnet --info
