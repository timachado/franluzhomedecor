name: Fetch Biblia EBD Atlas Relief Asset

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  atlas-relief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download public topographic relief asset
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Israel_topo_blank.jpg/500px-Israel_topo_blank.jpg' \
            -o Israel-topo-500.jpg
          file Israel-topo-500.jpg
          test -s Israel-topo-500.jpg
          ls -lh Israel-topo-500.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Atlas-Relief
          path: Israel-topo-500.jpg
          retention-days: 2
