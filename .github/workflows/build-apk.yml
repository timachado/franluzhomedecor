name: Build FranLuz APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify and rename
        run: |
          ls -lah app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FranLuz_Home_Decor_2.8.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Android-2.8.2-APK
          path: FranLuz_Home_Decor_2.8.2.apk
          retention-days: 30
