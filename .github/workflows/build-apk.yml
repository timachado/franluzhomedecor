name: Build Biblia EBD RC5 Native DEX

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-native-dex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Compile FileActivity and dex only the new classes
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8="$ANDROID_HOME/build-tools/36.0.0/d8"
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            rc5-native/stubs/com/timachado/bibliaebd/MainActivity.java \
            rc5-native/src/com/timachado/bibliaebd/FileActivity.java
          mapfile -t PROGRAM_CLASSES < <(find build/classes/com/timachado/bibliaebd -maxdepth 1 -type f -name 'FileActivity*.class' -print)
          test "${#PROGRAM_CLASSES[@]}" -gt 0
          "$D8" --min-api 24 --lib "$ANDROID_JAR" --classpath build/classes --output build/dex "${PROGRAM_CLASSES[@]}"
          test -s build/dex/classes.dex
          cp build/dex/classes.dex Biblia-EBD-RC5-classes3.dex
          ls -lh Biblia-EBD-RC5-classes3.dex

      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-RC5-Native-DEX
          path: Biblia-EBD-RC5-classes3.dex
          retention-days: 2
