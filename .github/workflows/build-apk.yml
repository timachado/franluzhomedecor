name: Build FranLuz APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe FranLuz InfinityFree HTTPS
        run: |
          echo '=== CERTIFICATE ==='
          echo | openssl s_client -connect franluzhomedecor.infinityfree.io:443 -servername franluzhomedecor.infinityfree.io 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          echo '=== HTTPS ==='
          curl -I -L --max-time 30 -A 'Mozilla/5.0 Android WebView' 'https://franluzhomedecor.infinityfree.io/?pwa=1&app=android' || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify and rename
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 3
          cp app/build/outputs/apk/debug/app-debug.apk FranLuz_Home_Decor_2.8.6_Stable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Android-2.8.6-Stable-APK
          path: FranLuz_Home_Decor_2.8.6_Stable.apk
          retention-days: 30
