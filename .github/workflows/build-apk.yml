name: Build BORDATTO APK

on:
  push:
    branches: [build-apk-282]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build BORDATTO debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BORDATTO_Android_v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BORDATTO-Android-v1.0.0-APK
          path: BORDATTO_Android_v1.0.0.apk
          retention-days: 30
