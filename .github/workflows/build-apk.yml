name: Build FranLuz APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe FranLuz SSL and origin
        run: |
          echo '=== CERTIFICATE ==='
          echo | openssl s_client -connect franluzhomedecor.flashhub.net:443 -servername franluzhomedecor.flashhub.net 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          echo '=== HTTPS STRICT ==='
          curl -I -L --max-time 20 'https://franluzhomedecor.flashhub.net/?pwa=1&app=android' || true
          echo '=== HTTPS INSECURE DIAGNOSTIC ONLY ==='
          curl -k -L --max-time 20 -sS -D /tmp/headers.txt -o /tmp/body.html 'https://franluzhomedecor.flashhub.net/?pwa=1&app=android' || true
          cat /tmp/headers.txt || true
          echo 'bytes:' $(wc -c </tmp/body.html 2>/dev/null || echo 0)
          head -c 1800 /tmp/body.html 2>/dev/null || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify and rename
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FranLuz_Home_Decor_2.8.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Android-2.8.4-APK
          path: FranLuz_Home_Decor_2.8.4.apk
          retention-days: 30
