name: Build FranLuz APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify official FranLuz icon
        run: |
          echo '=== REBUILD APPROVED ICON ==='
          echo 'cc3b318fe8274cdc2c1c219a2030d3d7320bf06089c84eec94aecc9e1ebc6a6b  app/icon_parts/part2_q1_fix.b64' | sha256sum -c -
          cat app/icon_parts/part2_q1_fix.b64 > /tmp/part2_fixed.b64
          tail -c +876 app/icon_parts/part2.b64 >> /tmp/part2_fixed.b64
          echo '3e84977d0021e281d60a6adc8e39bbc806ce1c9cc5fa61dde9c5a52179b6e0e8  /tmp/part2_fixed.b64' | sha256sum -c -
          mkdir -p app/src/main/res/drawable-nodpi
          cat app/icon_parts/part1.b64 /tmp/part2_fixed.b64 app/icon_parts/part3.b64 app/icon_parts/part4.b64 | tr -d '\r\n' | base64 -d > app/src/main/res/drawable-nodpi/franluz_app_icon.png
          file app/src/main/res/drawable-nodpi/franluz_app_icon.png
          echo 'c475e22792192438093b2b303b996d909ec14891fa2a8210471d780ef6b0f28e  app/src/main/res/drawable-nodpi/franluz_app_icon.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/drawable-nodpi/franluz_app_icon.png').read_bytes()
          assert p[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(p) == 9890
          print('Official FranLuz icon verified byte-for-byte:', len(p), 'bytes')
          PY
      - name: Probe FranLuz InfinityFree HTTPS
        run: |
          curl -I -L --max-time 30 -A 'Mozilla/5.0 Android WebView' 'https://franluzhomedecor.infinityfree.io/?pwa=1&app=android' || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK and packaged icon
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          cd /tmp/apkcheck
          unzip -q "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          ICON_PATH=$(find . -type f -name 'franluz_app_icon.png' | head -n 1)
          test -n "$ICON_PATH"
          file "$ICON_PATH"
          python3 - "$ICON_PATH" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]).read_bytes()
          assert p[:8] == b'\x89PNG\r\n\x1a\n', 'Packaged launcher icon is not PNG'
          print('Packaged FranLuz icon verified:', len(p), 'bytes')
          PY
          cd "$GITHUB_WORKSPACE"
          cp app/build/outputs/apk/debug/app-debug.apk FranLuz_Home_Decor_2.8.9_Icone_Oficial.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Android-2.8.9-Icone-Oficial-APK
          path: FranLuz_Home_Decor_2.8.9_Icone_Oficial.apk
          retention-days: 30
