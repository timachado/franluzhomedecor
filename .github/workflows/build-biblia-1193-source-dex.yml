name: Build Biblia EBD 1.19.3 Live Lens Source DEX
on:
  push:
    branches: [temp-biblia-ebd-1193-source-dex]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Compile source-built Live Lens
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/native1193"
          mkdir -p "$ROOT/classes" "$ROOT/dex"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8="$ANDROID_HOME/build-tools/36.0.0/d8"
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ANDROID_JAR" -d "$ROOT/classes"             "$ROOT/stubs/com/timachado/bibliaebd/AuthActivity.java"             "$ROOT/src/com/timachado/bibliaebd/LensActivity.java"             "$ROOT/src/com/timachado/bibliaebd/LiveLensActivity.java"
          mapfile -t PROGRAM < <(find "$ROOT/classes/com/timachado/bibliaebd" -maxdepth 1 -type f \( -name 'LensActivity*.class' -o -name 'LensChromeClient*.class' -o -name 'LiveLensActivity*.class' \) -print)
          test "${#PROGRAM[@]}" -gt 3
          "$D8" --min-api 24 --lib "$ANDROID_JAR" --classpath "$ROOT/classes" --output "$ROOT/dex" "${PROGRAM[@]}"
          test -s "$ROOT/dex/classes.dex"
          cp "$ROOT/dex/classes.dex" "$ROOT/Biblia-EBD-1.19.3-LiveLens-classes5.dex"
          sha256sum "$ROOT/Biblia-EBD-1.19.3-LiveLens-classes5.dex" > "$ROOT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-1.19.3-LiveLens-DEX
          path: |
            native1193/Biblia-EBD-1.19.3-LiveLens-classes5.dex
            native1193/SHA256SUMS.txt
          retention-days: 2
