name: Export Bíblia EBD dev signing tools

on:
  push:
    branches:
      - build-biblia-ebd-temp
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar build-tools 35
        run: sdkmanager "build-tools;35.0.0"
      - name: Preparar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/biblia-sign-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/biblia-sign-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/biblia-sign-tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" /tmp/biblia-sign-tools/lib64/libc++.so
          cp app/test-signing.jks /tmp/biblia-sign-tools/test-signing.jks
      - name: Artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-Dev-Signing-Tools-Temporary
          path: /tmp/biblia-sign-tools/**
          retention-days: 1
