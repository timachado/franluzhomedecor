name: Build BORDATTO APK
on:
  push:
    branches: [bordatto-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMANAGER" "platforms;android-36"
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            yes | "$SDKMANAGER" "build-tools;36.0.0"
          fi
      - name: Install .NET MAUI Android workload
        run: |
          dotnet --info
          dotnet workload install maui-android
          dotnet workload list
      - name: Restore MAUI project
        working-directory: BORDATTO_Maui_0.3
        run: dotnet restore BORDATTO.Maui.csproj
      - name: Build BORDATTO 0.3.1 MAUI debug APK
        working-directory: BORDATTO_Maui_0.3
        run: dotnet build BORDATTO.Maui.csproj -f net10.0-android -c Debug --no-restore -p:AndroidPackageFormats=apk
      - name: Locate APK
        id: apk
        run: |
          APK=$(find BORDATTO_Maui_0.3/bin/Debug/net10.0-android -type f -name '*-Signed.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find BORDATTO_Maui_0.3/bin/Debug/net10.0-android -type f -name '*.apk' | head -1); fi
          test -n "$APK"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Free disk for Android runtime test
        run: |
          echo "Disk before cleanup"
          df -h /
          rm -rf BORDATTO_Maui_0.3/obj || true
          rm -rf "$HOME/.nuget/packages" || true
          sudo rm -rf /usr/share/dotnet/packs || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          echo "Disk after cleanup"
          df -h /
      - name: Android 15 runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 384M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -partition-size 2048
          script: |
            adb logcat -c
            adb install -r "${{ steps.apk.outputs.path }}"
            adb shell monkey -p com.bordatto.app -c android.intent.category.LAUNCHER 1
            READY=0
            for i in $(seq 1 18); do
              sleep 5
              adb shell pidof com.bordatto.app >/dev/null
              if adb logcat -d -v threadtime | grep -q "BORDATTO: Editor ready"; then
                READY=1
                echo "BORDATTO editor ready after $((i * 5)) seconds"
                break
              fi
            done
            echo "--- BORDATTO diagnostics ---"
            adb logcat -d -v threadtime | grep -E "BORDATTO|AndroidRuntime|FATAL EXCEPTION|monodroid|DOTNET" | tail -500 || true
            echo "--- crash buffer ---"
            adb logcat -d -b crash -v threadtime || true
            test "$READY" -eq 1
      - name: Verify and rename APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          cp "$APK" BORDATTO_0.3.1_MAUI_Skia_Startup_Fix_Teste.apk
          sha256sum BORDATTO_0.3.1_MAUI_Skia_Startup_Fix_Teste.apk > BORDATTO_0.3.1_MAUI_Skia_Startup_Fix_Teste.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BORDATTO-0.3.1-MAUI-Skia-Startup-Fix-APK
          path: |
            BORDATTO_0.3.1_MAUI_Skia_Startup_Fix_Teste.apk
            BORDATTO_0.3.1_MAUI_Skia_Startup_Fix_Teste.apk.sha256
          retention-days: 30
