name: Diagnose BORDATTO UI
on:
  push:
    branches: [bordatto-apk-build]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current 0.2.29 source
        run: python3 .github/scripts/patch_bordatto_052.py
      - name: Print interaction areas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt').read_text(encoding='utf-8')
          names=['LetteringScreen','EmbroiderySimulatorPanel','ViewerTool','MachineCheckPanel','DesignAnalyzerPanel','SafeEditorPanel']
          for name in names:
              needle='private fun '+name
              p=s.find(needle)
              if p<0:
                  print('\n=== MISSING',name,'===')
                  continue
              start=s.rfind('@Composable',0,p)
              if start<0: start=p
              nxt=s.find('\n@Composable\nprivate fun ',p+len(needle))
              if nxt<0: nxt=min(len(s), p+35000)
              print('\n===',name,'===\n')
              print(s[start:nxt])
          PY
