name: Inspect BORDATTO Traditional Generation
on:
  push:
    branches: [bordatto-apk-build]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 0.2.35 and inspect Traditional generation
        run: |
          python3 .github/scripts/patch_bordatto_065.py
          python3 - <<'PY'
          from pathlib import Path
          t=Path('BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt').read_text(encoding='utf-8')
          keys=['onTraditionalGenerate','TraditionalQuick','TraditionalLettering','generateLetteringDesign(','TRADITIONAL_EDITOR','mergeTraditionalText034(']
          for key in keys:
              print('\n===',key,'===')
              pos=0; n=0
              while True:
                  try: i=t.index(key,pos)
                  except ValueError: break
                  print(t[max(0,i-900):min(len(t),i+1400)])
                  pos=i+len(key); n+=1
                  if n>=8: break
          PY
