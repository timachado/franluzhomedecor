name: Build BORDATTO APK
on:
  push:
    branches: [bordatto-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack BORDATTO
        run: unzip -q BORDATTO_Foundation_0.1.zip

      - name: Build debug APK
        working-directory: BORDATTO_Foundation_0.1
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          APK="BORDATTO_Foundation_0.1/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" BORDATTO_Foundation_0.1_debug.apk
          sha256sum BORDATTO_Foundation_0.1_debug.apk > BORDATTO_Foundation_0.1_debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BORDATTO-Foundation-0.1-APK
          path: |
            BORDATTO_Foundation_0.1_debug.apk
            BORDATTO_Foundation_0.1_debug.apk.sha256
          retention-days: 30
