name: Diagnose BORDATTO Viewer
on:
  push:
    branches: [bordatto-apk-build]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild cumulative 0.2.28 source
        run: python3 .github/scripts/patch_bordatto_050.py
      - name: Print ViewerScreen layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt').read_text(encoding='utf-8')
          start=s.index('@Composable\nprivate fun ViewerScreen')
          end=s.find('@Composable\nprivate fun ', start+20)
          if end < 0: end=min(len(s), start+45000)
          print(s[start:end])
          PY
