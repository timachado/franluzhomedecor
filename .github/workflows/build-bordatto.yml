name: Inspect BORDATTO Traditional Simulator
on:
  push:
    branches: [bordatto-apk-build]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and print Traditional simulator implementation
        run: |
          python3 .github/scripts/patch_bordatto_064.py
          python3 - <<'PY'
          from pathlib import Path
          t=Path('BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt').read_text(encoding='utf-8')
          def block(signature):
              s=t.index(signature); b=t.index('{',s); d=0
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0: return t[s:i+1]
              raise RuntimeError(signature)
          print('=== SIMULATOR BODY ===')
          print(block('@Composable\nprivate fun TraditionalSimulatorScreen034'))
          print('=== DESIGN CANVAS BODY ===')
          print(block('@Composable\nprivate fun TraditionalDesignCanvas034'))
          PY
