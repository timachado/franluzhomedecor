name: Diagnose BORDATTO 0.2.30 Source
on:
  push:
    branches: [bordatto-apk-build]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0.2.30
        run: python3 .github/scripts/patch_bordatto_053.py
      - name: Inspect declarations and brace depth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('BORDATTO_Foundation_0.1/app/src/main/java/com/bordatto/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          needles=['appPrefs','data class MachineConfig','fun loadMachineConfig','data class LibraryItem','fun CostCalculatorScreen','private fun LetteringScreen','private fun MachineScreen','private fun EmbroiderySimulatorPanel']
          for n in needles:
              print(n, s.find(n))
          depth=0
          for i,line in enumerate(s.splitlines(),1):
              clean=line.split('//')[0]
              depth += clean.count('{')-clean.count('}')
              if i in (120,145,180,192,850,900,929,1000,1200,1400,2000,2500,3000,3500,4000,4500): print('DEPTH',i,depth,line[:120])
          print('FINAL_DEPTH',depth)
          for lo,hi in [(110,210),(850,1030),(2500,2650)]:
              print(f'---LINES {lo}-{hi}---')
              for i,line in enumerate(s.splitlines(),1):
                  if lo <= i <= hi: print(f'{i}: {line}')
          PY
