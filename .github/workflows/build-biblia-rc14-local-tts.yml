name: Build Biblia EBD RC14 Local TTS DEX
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-rc14-dex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Compile RC14 local TTS bridge
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$PWD/tmp-biblia-rc14"
          mkdir -p "$ROOT/classes" "$ROOT/dex"
          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d "$ROOT/classes" \
            "$ROOT/MainActivity.java" "$ROOT/AuthActivity.java"
          "$ANDROID_HOME/build-tools/36.0.0/d8" \
            --min-api 24 \
            --lib "$ANDROID_HOME/platforms/android-36/android.jar" \
            --output "$ROOT/dex" \
            "$ROOT/classes/com/timachado/bibliaebd/AuthActivity"*.class
          cp "$ROOT/dex/classes.dex" "$ROOT/Biblia-EBD-RC14-LocalTTS-classes4.dex"
          ls -lh "$ROOT/Biblia-EBD-RC14-LocalTTS-classes4.dex"
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-EBD-RC14-LocalTTS-DEX
          path: tmp-biblia-rc14/Biblia-EBD-RC14-LocalTTS-classes4.dex
          retention-days: 2
